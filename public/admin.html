<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Assistant Admin — Troy SD BoardDocs</title>
<style>
  :root{--bg:#fff;--fg:#1a1c1e;--muted:#5b6167;--line:#e2e5e9;--card:#f7f8fa;--accent:#1668c1;--accent-fg:#fff;--ok:#1a7f4b;--warn:#b26a00;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--muted:#9aa1a9;--line:#2a2e35;--card:#1e2127;--accent:#4f9dee;--accent-fg:#0c1116;--ok:#4ec98a;--warn:#e0a458;--err:#f2b8b5}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:1.3rem;margin:0 0 16px} h2{font-size:1.02rem;margin:26px 0 10px}
  input{padding:10px 12px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:9px;width:340px}
  button{font:inherit;font-weight:700;font-size:.85rem;padding:7px 14px;cursor:pointer;border:1px solid transparent;border-radius:8px;background:var(--accent);color:var(--accent-fg)}
  button.deny{background:transparent;color:var(--err);border-color:var(--line)}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
  .pending{color:var(--warn)} .approved{color:var(--ok)} .denied{color:var(--err)} .answered{color:var(--ok)} .error{color:var(--err)} .answering{color:var(--accent)}
  .awaiting_approval{color:var(--warn)} .declined{color:var(--err)}
  .muted{color:var(--muted)} .q{max-width:340px} details{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛂 Assistant Admin</h1>
  <div id="key-row">
    <input id="key" type="password" placeholder="admin key" autocomplete="off">
    <button id="send">Send code</button>
    <p class="muted" style="font-size:.85rem">A six-digit code is texted to the number on file.</p>
  </div>
  <div id="code-row" hidden>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" style="width:180px">
    <button id="verify">Sign in</button>
    <button id="back" class="deny">Start over</button>
    <p class="muted" style="font-size:.85rem">Expires in 10 minutes. Five wrong tries voids it.</p>
  </div>
  <p id="msg" class="muted" hidden></p>
  <div id="panel" hidden>
    <p style="text-align:right;margin:0 0 -8px"><button id="logout" class="deny">Sign out</button></p>
    <h2>Registrations</h2>
    <table id="users"><thead><tr><th>Status</th><th>Email</th><th>Name</th><th>Phone</th><th>Reason</th><th>Registered</th><th></th></tr></thead><tbody></tbody></table>
    <h2>Recent questions</h2>
    <table id="qs"><thead><tr><th>#</th><th>User</th><th>Question / answer</th><th>Status</th><th>Tokens</th><th>Asked</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
// Only the 12-hour session token is persisted. The admin key is held in a variable for the few
// seconds between requesting a code and redeeming it, and never written to storage -- a stolen
// browser profile is then worth one expiring session rather than the permanent key.
let pendingKey="";
const sess=()=>localStorage.getItem("tsd_admin_session")||"";
const api=(p,o)=>fetch("/api/assistant/admin"+p,{headers:{"content-type":"application/json","x-admin-session":sess()},...o});
const say=(t,bad)=>{const m=$("msg");m.hidden=!t;m.textContent=t||"";m.style.color=bad?"var(--err)":"var(--muted)"};
function showStep(s){
  $("key-row").hidden=s!=="key"; $("code-row").hidden=s!=="code"; $("panel").hidden=s!=="panel";
}
async function load(){
  const r=await api("/users");
  if(r.status===401){localStorage.removeItem("tsd_admin_session");showStep("key");say("Session expired — sign in again.",true);return}
  showStep("panel");say("");
  const users=(await r.json()).users||[];
  $("users").tBodies[0].innerHTML=users.map(u=>`
    <tr><td><span class="pill ${esc(u.status)}">${esc(u.status)}</span></td>
    <td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.phone||"")}</td><td class="q">${esc(u.reason)}</td>
    <td class="muted">${esc((u.created_at||"").slice(0,16).replace("T"," "))}</td>
    <td>${u.status!=="approved"?`<button data-a="approved" data-id="${u.id}">Approve</button> `:""}
        ${u.status!=="denied"?`<button class="deny" data-a="denied" data-id="${u.id}">Deny</button>`:""}</td></tr>`).join("");
  $("users").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    await api("/decide",{method:"POST",body:JSON.stringify({id:+b.dataset.id,decision:b.dataset.a})});load();
  });
  const qs=(await (await api("/questions")).json()).questions||[];
  $("qs").tBodies[0].innerHTML=qs.map(q=>`
    <tr><td>${q.id}</td><td class="muted">${esc(q.email)}</td>
    <td class="q"><b>${esc(q.question)}</b>${q.answer?`<details><summary class="muted">answer</summary>${esc(q.answer)}</details>`:""}${q.error?`<div class="error">${esc(q.error)}</div>`:""}</td>
    <td><span class="pill ${esc(q.status)}">${esc(q.status)}</span>
      ${q.status==="awaiting_approval"?`<div style="margin-top:6px"><button data-m="approve" data-id="${q.id}">OK</button> <button class="deny" data-m="decline" data-id="${q.id}">✗</button></div>`:""}</td>
    <td>${q.tokens_used?esc(String(q.tokens_used)):"—"}</td>
    <td class="muted">${esc((q.asked_at||"").slice(5,16).replace("T"," "))}</td></tr>`).join("");
  $("qs").querySelectorAll("button[data-m]").forEach(b=>b.onclick=async()=>{
    await api("/moderate",{method:"POST",body:JSON.stringify({id:+b.dataset.id,decision:b.dataset.m})});load();
  });
}
const post=(p,b)=>fetch("/api/assistant/admin"+p,{method:"POST",
  headers:{"content-type":"application/json","x-admin-session":sess()},body:JSON.stringify(b)});

$("send").onclick=async()=>{
  const k=$("key").value.trim();
  if(!k)return say("Enter the admin key.",true);
  $("send").disabled=true;say("Sending…");
  const r=await post("/login/start",{key:k});
  const d=await r.json().catch(()=>({}));
  $("send").disabled=false;
  if(!r.ok)return say(d.error||"could not send a code",true);
  pendingKey=k;$("key").value="";showStep("code");say("Code sent. Check your phone.");$("code").focus();
};
$("verify").onclick=async()=>{
  const c=$("code").value.trim();
  if(!c)return say("Enter the code.",true);
  $("verify").disabled=true;say("Verifying…");
  const r=await post("/login/verify",{key:pendingKey,code:c});
  const d=await r.json().catch(()=>({}));
  $("verify").disabled=false;
  if(!r.ok)return say(d.error||"wrong code",true);
  pendingKey="";$("code").value="";
  localStorage.setItem("tsd_admin_session",d.token);
  load();
};
$("back").onclick=()=>{pendingKey="";$("code").value="";showStep("key");say("")};
$("logout").onclick=async()=>{
  await post("/logout",{}).catch(()=>{});
  localStorage.removeItem("tsd_admin_session");showStep("key");say("Signed out.");
};
$("key").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")$("verify").click()});

if(sess())load(); else showStep("key");
setInterval(()=>{if(sess()&&!$("panel").hidden)load()},30000);
</script>
</body>
</html>
